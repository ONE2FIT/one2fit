<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教練功能評估 × 產品配對系統 v1.1（含詳細操作）</title>
<style>
  :root{
    --green:#2E7D32; --green-l:#C8E6C9; --green-m:#81C784;
    --gold:#C9A84C; --red:#C62828; --orange:#EF6C00; --yellow:#F9A825;
    --bg:#F5F8F0; --card:#FDFBF7; --text:#1B3A1B; --text2:#3A5A3A; --muted:#666;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;font-size:14px}
  header{background:var(--green);color:#fff;padding:20px 24px;position:sticky;top:0;z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,.15)}
  header h1{font-size:20px;font-weight:700}
  header p{font-size:12px;opacity:.85;margin-top:4px}
  .wrap{display:flex;max-width:1500px;margin:0 auto;gap:20px;padding:20px}
  main{flex:1;min-width:0}
  aside{width:320px;flex-shrink:0;position:sticky;top:90px;align-self:flex-start;
    max-height:calc(100vh - 110px);overflow-y:auto}
  section{background:var(--card);border-radius:16px;padding:20px;margin-bottom:20px;
    box-shadow:0 4px 20px rgba(0,0,0,.06)}
  section h2{font-size:17px;color:var(--green);margin-bottom:14px;padding-bottom:10px;
    border-bottom:2px solid var(--green-l);display:flex;align-items:center;gap:8px}
  section h2 .num{background:var(--green);color:#fff;width:26px;height:26px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .layer{margin-bottom:16px;border:1px solid #E0E8DC;border-radius:12px;overflow:hidden}
  .layer-head{background:var(--green-l);padding:10px 14px;font-weight:700;font-size:13px;
    color:var(--text);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .layer-head .badge{background:#fff;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600}
  .layer-body{padding:8px 12px;display:none}
  .layer-body.open{display:block}
  .item{display:grid;grid-template-columns:28px 1fr 160px 28px 28px;gap:8px;align-items:start;
    padding:6px 0;border-bottom:1px dashed #E8EDE4;font-size:13px}
  .item:last-child{border-bottom:none}
  .item .id{font-size:11px;color:var(--muted);font-weight:600;padding-top:2px}
  .item .name{font-weight:600}
  .item .name small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
  .item .standard{font-size:11px;color:var(--text2);background:#F0F5EC;border-radius:6px;
    padding:3px 6px;line-height:1.4}
  .item input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);cursor:pointer;margin-top:2px}
  .info-btn{width:20px;height:20px;border-radius:50%;background:var(--green-l);color:var(--green);
    border:none;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;
    justify-content:center;margin-top:2px;transition:all .15s;font-family:inherit}
  .info-btn:hover{background:var(--green);color:#fff;transform:scale(1.15)}
  .item.abnormal{background:#FFF3E0;border-radius:6px;margin:2px -6px;padding:6px 6px}
  .item.abnormal .name{color:var(--red)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .form-row.full{grid-template-columns:1fr}
  label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
  input[type=text],input[type=number],select{width:100%;padding:8px 10px;border:1px solid #D5E0D0;
    border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
  textarea{width:100%;padding:8px 10px;border:1px solid #D5E0D0;border-radius:8px;
    font-size:13px;font-family:inherit;background:#fff;min-height:60px;resize:vertical}
  .redflag{background:#FFEBEE;border:1px solid #FFCDD2;border-radius:10px;padding:12px;margin-top:8px}
  .redflag label{display:flex;align-items:flex-start;gap:8px;font-weight:400;font-size:13px;
    color:var(--red);margin-bottom:6px;cursor:pointer}
  .redflag input{accent-color:var(--red);width:16px;height:16px;flex-shrink:0;margin-top:3px}
  .sidebar-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;
    box-shadow:0 4px 20px rgba(0,0,0,.06)}
  .sidebar-card h3{font-size:13px;color:var(--green);margin-bottom:10px;
    text-transform:uppercase;letter-spacing:.5px}
  .score-big{font-size:42px;font-weight:800;line-height:1;color:var(--green)}
  .score-big small{font-size:16px;font-weight:600;color:var(--muted)}
  .grade{display:inline-block;padding:4px 14px;border-radius:20px;font-weight:700;
    font-size:13px;margin-top:6px}
  .grade.green{background:var(--green-l);color:var(--green)}
  .grade.yellow{background:#FFF9C4;color:#F57F17}
  .grade.orange{background:#FFE0B2;color:#E65100}
  .grade.red{background:#FFCDD2;color:var(--red)}
  .bar{height:8px;border-radius:4px;background:#E8EDE4;margin-top:10px;overflow:hidden}
  .bar-inner{height:100%;border-radius:4px;transition:width .3s,background .3s}
  .layer-stat{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;
    border-bottom:1px solid #F0F5EC}
  .layer-stat:last-child{border-bottom:none}
  .layer-stat b{color:var(--red)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;
    border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:all .15s;text-decoration:none}
  .btn-primary{background:var(--green);color:#fff}
  .btn-primary:hover{background:#1B5E20}
  .btn-gold{background:var(--gold);color:#fff}
  .btn-outline{background:#fff;color:var(--green);border:1.5px solid var(--green)}
  .btn-outline:hover{background:var(--green-l)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .product-card{border:1px solid #E0E8DC;border-radius:12px;padding:14px;margin-bottom:12px;
    background:#fff;position:relative}
  .product-card.recommended{border:2px solid var(--green);background:#F8FDF6}
  .product-card h4{font-size:14px;color:var(--green);margin-bottom:6px;display:flex;
    justify-content:space-between;align-items:center}
  .product-card .cat{font-size:10px;background:var(--green-l);color:var(--green);
    padding:1px 8px;border-radius:10px;font-weight:600}
  .product-card .row{display:flex;gap:6px;font-size:12px;margin-bottom:4px;flex-wrap:wrap}
  .product-card .row .k{color:var(--muted);flex-shrink:0;min-width:52px}
  .product-card .row .v{color:var(--text)}
  .product-card .warn{color:var(--red);font-weight:600}
  .product-card .match{font-size:11px;background:#FFF9C4;color:#F57F17;padding:2px 8px;
    border-radius:8px;display:inline-block;margin-top:4px}
  .rec-badge{position:absolute;top:-8px;right:12px;background:var(--green);color:#fff;
    font-size:10px;font-weight:700;padding:2px 10px;border-radius:10px}
  .empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}
  .card-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  .card-table th,.card-table td{border:1px solid #D5E0D0;padding:6px 8px;text-align:left;vertical-align:top}
  .card-table th{background:var(--green-l);font-weight:700;font-size:11px}
  .filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #D5E0D0;background:#fff;
    font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text2)}
  .filter-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);
    color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:999}
  .toast.show{opacity:1}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
    display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:85vh;
    overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:modalIn .2s ease}
  @keyframes modalIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .modal-head{background:var(--green);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;
    display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;z-index:2}
  .modal-head h3{font-size:16px;font-weight:700;line-height:1.4}
  .modal-head .sub{font-size:12px;opacity:.85;margin-top:2px}
  .modal-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;
    border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0;margin-left:12px;
    display:flex;align-items:center;justify-content:center;font-family:inherit}
  .modal-close:hover{background:rgba(255,255,255,.35)}
  .modal-body{padding:20px}
  .modal-section{margin-bottom:16px}
  .modal-section h4{font-size:13px;color:var(--green);margin-bottom:6px;display:flex;
    align-items:center;gap:6px;font-weight:700}
  .modal-section h4 .ico{font-size:15px}
  .modal-section ul{list-style:none;padding-left:0}
  .modal-section ul li{padding:4px 0 4px 20px;position:relative;font-size:13px;
    color:var(--text2);line-height:1.55}
  .modal-section ul li::before{content:'▸';position:absolute;left:4px;color:var(--green-m);font-weight:700}
  .modal-section .std-box{background:#F0F5EC;border-radius:8px;padding:10px 12px;
    font-size:13px;color:var(--text);border-left:3px solid var(--green)}
  .modal-section .warn-box{background:#FFEBEE;border-radius:8px;padding:10px 12px;
    font-size:13px;color:var(--red);border-left:3px solid var(--red)}
  .modal-section .tip-box{background:#FFF9C4;border-radius:8px;padding:10px 12px;
    font-size:13px;color:#F57F17;border-left:3px solid var(--yellow)}
  .modal-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;
    border-top:1px dashed #D5E0D0}
  .modal-meta span{font-size:11px;background:var(--green-l);color:var(--green);
    padding:3px 10px;border-radius:10px;font-weight:600}
  @media print{
    header,aside,.btn-row,.filter-row,.info-btn,.modal-overlay{display:none!important}
    body{background:#fff;font-size:11px}
    .wrap{display:block;padding:0}
    section{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid;margin-bottom:10px}
    .layer-body{display:block!important}
    .product-card{page-break-inside:avoid}
    .item{grid-template-columns:24px 1fr 140px 24px!important}
  }
  @media(max-width:900px){
    .wrap{flex-direction:column}
    aside{width:100%;position:static;max-height:none}
    .form-row{grid-template-columns:1fr}
    .item{grid-template-columns:24px 1fr 24px 24px;gap:6px}
    .item .standard{display:none}
    .modal{max-height:92vh}
  }
</style>
</head>
<body>

<header>
  <h1>🧠 教練功能評估 × 產品配對系統</h1>
  <p>80 項評估 · 39 項產品 · 六步閉環 SOP · 每項評估附詳細操作彈窗</p>
</header>

<div class="wrap">
<main>

<!-- STEP 1 -->
<section>
  <h2><span class="num">1</span>客戶資料 + 主訴 + 紅色警號</h2>
  <div class="form-row">
    <div><label>姓名</label><input type="text" id="cName" placeholder="客戶姓名"></div>
    <div><label>日期</label><input type="text" id="cDate" placeholder="YYYY-MM-DD"></div>
    <div><label>年齡</label><input type="number" id="cAge" placeholder="歲"></div>
    <div><label>性別</label>
      <select id="cSex"><option value="">請選擇</option><option>男</option><option>女</option></select>
    </div>
    <div><label>身高 (cm)</label><input type="number" id="cH" placeholder="cm"></div>
    <div><label>體重 (kg)</label><input type="number" id="cW" placeholder="kg"></div>
    <div><label>腰圍 (cm)</label><input type="number" id="cWaist" placeholder="cm"></div>
    <div><label>主要主訴</label>
      <select id="cChief">
        <option value="">請選擇</option>
        <option>疲勞</option><option>體態</option><option>情緒</option>
        <option>疼痛</option><option>睡眠</option><option>腸胃</option><option>其他</option>
      </select>
    </div>
  </div>
  <div class="form-row full">
    <div><label>病史 / 用藥</label><textarea id="cHx" placeholder="高血壓、糖尿病、甲狀腺、自體免疫、用藥..."></textarea></div>
  </div>
  <div class="redflag">
    <strong style="color:var(--red);font-size:13px;">🚨 紅色警號（任何一項 → 暫停產品建議，先轉介）</strong>
    <label><input type="checkbox" class="rf" data-rf="持續胸痛"> 持續胸痛</label>
    <label><input type="checkbox" class="rf" data-rf="呼吸困難"> 呼吸困難</label>
    <label><input type="checkbox" class="rf" data-rf="不明原因體重下降"> 不明原因體重下降</label>
    <label><input type="checkbox" class="rf" data-rf="持續發燒"> 持續發燒</label>
    <label><input type="checkbox" class="rf" data-rf="嚴重水腫"> 嚴重水腫</label>
    <label><input type="checkbox" class="rf" data-rf="血壓持續偏高≥140/90"> 血壓持續偏高 ≥140/90</label>
    <label><input type="checkbox" class="rf" data-rf="情緒嚴重低落"> 情緒嚴重低落</label>
    <label><input type="checkbox" class="rf" data-rf="鞏膜明顯黃染"> 鞏膜明顯黃染</label>
    <label><input type="checkbox" class="rf" data-rf="其他紅色警號"> 其他：<input type="text" id="rfOther" style="width:180px;display:inline-block;padding:2px 6px;font-size:12px" placeholder="請註明"></label>
  </div>
</section>

<!-- STEP 2 -->
<section>
  <h2><span class="num">2</span>80 項評估（勾選 = 異常，ⓘ = 詳細操作）</h2>
  <div id="assessWrap"></div>
</section>

<!-- STEP 3 -->
<section>
  <h2><span class="num">3</span>總評分分級</h2>
  <div id="gradeWrap"></div>
</section>

<!-- STEP 4 -->
<section>
  <h2><span class="num">4</span>異常聚類 + 主問題選擇</h2>
  <div id="clusterWrap"></div>
</section>

<!-- STEP 5 -->
<section>
  <h2><span class="num">5</span>產品門檻匹配 + 排除</h2>
  <div class="filter-row" id="filterRow">
    <button class="filter-btn active" data-f="all">全部 39 項</button>
    <button class="filter-btn" data-f="rec">✅ 只顯示推薦</button>
    <button class="filter-btn" data-f="base">基礎營養</button>
    <button class="filter-btn" data-f="sport">運動營養</button>
    <button class="filter-btn" data-f="immune">免疫腸道</button>
    <button class="filter-btn" data-f="bone">骨骼關節睡眠</button>
    <button class="filter-btn" data-f="beauty">抗衰美容</button>
    <button class="filter-btn" data-f="special">特殊補充</button>
  </div>
  <div id="productWrap"></div>
</section>

<!-- STEP 6 -->
<section>
  <h2><span class="num">6</span>產品建議卡 + 復評日期</h2>
  <div id="cardWrap"><div class="empty">完成評估後，系統會自動生成產品建議卡</div></div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="generateCard()">📋 生成建議卡</button>
    <button class="btn btn-gold" onclick="window.print()">🖨️ 列印 / 匯出 PDF</button>
    <button class="btn btn-outline" onclick="resetAll()">🔄 重置</button>
  </div>
</section>

</main>

<!-- SIDEBAR -->
<aside>
  <div class="sidebar-card">
    <h3>📊 實時評分</h3>
    <div class="score-big" id="sideScore">0<small> / 80</small></div>
    <div class="grade green" id="sideGrade">🟢 綠</div>
    <div class="bar"><div class="bar-inner" id="sideBar" style="width:0%;background:var(--green)"></div></div>
    <div id="sideLayers" style="margin-top:12px"></div>
  </div>
  <div class="sidebar-card">
    <h3>🚨 紅色警號</h3>
    <div id="sideRed" style="font-size:13px;color:var(--muted)">未發現</div>
  </div>
  <div class="sidebar-card">
    <h3>💊 推薦產品</h3>
    <div id="sideProducts" style="font-size:13px;color:var(--muted)">完成評估後顯示</div>
  </div>
  <div class="sidebar-card">
    <h3>📅 復評日期</h3>
    <div id="sideReview" style="font-size:13px">—</div>
  </div>
</aside>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h3 id="modalTitle">評估名稱</h3>
        <div class="sub" id="modalSub">評估編碼</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   資料層：80 項評估 + 詳細操作
   ============================================================ */
const LAYERS = {
  1:{name:'第一層：結構功能',short:'結構'},
  2:{name:'第二層：能量代謝',short:'能量'},
  3:{name:'第三層：發炎免疫',short:'發炎'},
  4:{name:'第四層：腸道吸收',short:'腸道'},
  5:{name:'第五層：荷爾蒙生活',short:'荷爾蒙'}
};

const ASSESS = [
/* ===== 第一層 結構功能 24 項 ===== */
{id:'S01',layer:1,name:'小腿圍',method:'軟尺量小腿最粗處',std:'男<34cm / 女<33cm',code:'S1',
 detail:{prep:['軟尺一條','客戶放鬆站立，雙腳與肩同寬'],
  steps:['請客戶捲起褲管，露出小腿最粗位置','軟尺環繞小腿最粗處（通常在腓腸肌肌腹）','軟尺貼皮膚但唔好勒緊','讀取數值，精確到 0.1cm','左右腳各測一次，取較大值'],
  judge:'男 <34cm 或 女 <33cm → 肌少症風險，蛋白質攝取不足或活動量太低',
  errors:['軟尺勒太緊，讀數偏細','客戶站姿不穩，小腿肌肉未放鬆','只測一邊，忽略左右差異'],
  tip:'小腿圍係肌少症嘅簡單篩查指標。如果客戶小腿圍偏低，要先處理蛋白質攝取，唔好一開始就做高強度訓練。'}},
{id:'S02',layer:1,name:'握力',method:'握力計，左右各測2次取高',std:'男<28kg / 女<18kg',code:'S2',
 detail:{prep:['握力計一部','客戶坐姿，肩部放鬆，手肘屈曲90°'],
  steps:['調校握力計把手闊度，約中指第二節','客戶用最大力握緊，持續3秒','讀取數值','休息30秒，同一手再測一次','換另一隻手，重複以上步驟','左右手各取最高值'],
  judge:'男 <28kg 或 女 <18kg → 整體肌力不足，可能蛋白質不足、神經肌肉功能下降',
  errors:['握力計把手太闊或太窄','客戶未盡全力','測量時手臂未固定，用身體代償'],
  tip:'握力係整體肌力嘅「窗口」。握力低嘅客戶，訓練時要由低強度開始，同時補充蛋白質。'}},
{id:'S03',layer:1,name:'步速',method:'4米直線行走計時',std:'<0.8 m/s',code:'S3',
 detail:{prep:['4米直線距離（可用膠紙 marking）','計時器','客戶穿平底鞋'],

/* ============================================================
   狀態
   ============================================================ */
const state = {checked:new Set(), redFlags:new Set(), filter:'all', products:[]};

/* ============================================================
   渲染 80 項評估
   ============================================================ */
function renderAssess(){
  const wrap = document.getElementById('assessWrap');
  let html = '';
  for(let l=1;l<=5;l++){
    const items = ASSESS.filter(a=>a.layer===l);
    html += `<div class="layer">
      <div class="layer-head" onclick="toggleLayer(${l})">
        <span>${LAYERS[l].name}</span>
        <span class="badge" id="badge-${l}">0 / ${items.length}</span>
      </div>
      <div class="layer-body ${l===1?'open':''}" id="layer-${l}">`;
    items.forEach(a=>{
      html += `<div class="item" id="item-${a.id}">
        <div class="id">${a.id}</div>
        <div class="name">${a.name}<small>${a.method}</small></div>
        <div class="standard">異常：${a.std}</div>
        <input type="checkbox" onchange="toggleItem('${a.id}')" data-id="${a.id}">
        <button class="info-btn" onclick="showDetail('${a.id}')" title="詳細操作">ⓘ</button>
      </div>`;
    });
    html += `</div></div>`;
  }
  wrap.innerHTML = html;
}

function toggleLayer(l){
  document.getElementById('layer-'+l).classList.toggle('open');
}

function toggleItem(id){
  const cb = document.querySelector(`input[data-id="${id}"]`);
  if(cb.checked) state.checked.add(id); else state.checked.delete(id);
  document.getElementById('item-'+id).classList.toggle('abnormal', cb.checked);
  updateAll();
}

/* ============================================================
   詳細操作彈窗
   ============================================================ */
function showDetail(id){
  const a = ASSESS.find(x=>x.id===id);
  if(!a || !a.detail) return;
  const d = a.detail;
  document.getElementById('modalTitle').textContent = a.name;
  document.getElementById('modalSub').textContent = `${a.id} · 評估方法：${a.method} · 異常標準：${a.std}`;

  let html = '';
  html += `<div class="modal-section"><h4><span class="ico">🧰</span>準備物品</h4><ul>`;
  d.prep.forEach(p=>html+=`<li>${p}</li>`);
  html += `</ul></div>`;

  html += `<div class="modal-section"><h4><span class="ico">📋</span>具體操作步驟</h4><ul>`;
  d.steps.forEach((s,i)=>html+=`<li><b>${i+1}.</b> ${s}</li>`);
  html += `</ul></div>`;

  html += `<div class="modal-section"><h4><span class="ico">📊</span>判讀標準</h4><div class="std-box">${d.judge}</div></div>`;

  if(d.errors && d.errors.length){
    html += `<div class="modal-section"><h4><span class="ico">⚠️</span>常見錯誤</h4><ul>`;
    d.errors.forEach(e=>html+=`<li>${e}</li>`);
    html += `</ul></div>`;
  }

  if(d.tip){
    html += `<div class="modal-section"><h4><span class="ico">💡</span>教練提示</h4><div class="tip-box">${d.tip}</div></div>`;
  }

  html += `<div class="modal-meta">
    <span>編碼：${a.code}</span>
    <span>層次：${LAYERS[a.layer].name}</span>
    <span>異常標準：${a.std}</span>
  </div>`;

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ============================================================
   紅色警號
   ============================================================ */
document.querySelectorAll('.rf').forEach(cb=>{
  cb.addEventListener('change', ()=>{
    if(cb.checked) state.redFlags.add(cb.dataset.rf); else state.redFlags.delete(cb.dataset.rf);
    updateAll();
  });
});

/* ============================================================
   評分 + 分級
   ============================================================ */
function getGrade(n, red){
  if(red) return {g:'red', label:'🔴 紅 — 暫停訓練，轉介', cls:'red'};
  if(n<=7) return {g:'green', label:'🟢 綠 — 訓練＋基礎營養', cls:'green'};
  if(n<=17) return {g:'yellow', label:'🟡 黃 — 訓練＋針對性營養，2週覆查', cls:'yellow'};
  if(n<=27) return {g:'orange', label:'🟠 橙 — 先2-4週消炎飲食，暫停高強度', cls:'orange'};
  return {g:'red', label:'🔴 紅 — 暫停訓練，轉介', cls:'red'};
}

function updateAll(){
  const total = state.checked.size;
  const red = state.redFlags.size > 0;
  const grade = getGrade(total, red);

  document.getElementById('sideScore').innerHTML = total + '<small> / 80</small>';
  const gEl = document.getElementById('sideGrade');
  gEl.textContent = grade.label;
  gEl.className = 'grade ' + grade.cls;
  const pct = Math.round(total/80*100);
  const bar = document.getElementById('sideBar');
  bar.style.width = pct + '%';
  bar.style.background = grade.g==='green'?'var(--green)':grade.g==='yellow'?'var(--yellow)':grade.g==='orange'?'var(--orange)':'var(--red)';

  let ls = '';
  for(let l=1;l<=5;l++){
    const items = ASSESS.filter(a=>a.layer===l);
    const cnt = items.filter(a=>state.checked.has(a.id)).length;
    ls += `<div class="layer-stat"><span>${LAYERS[l].short}</span><span><b>${cnt}</b> / ${items.length}</span></div>`;
    const badge = document.getElementById('badge-'+l);
    if(badge) badge.textContent = cnt + ' / ' + items.length;
  }
  document.getElementById('sideLayers').innerHTML = ls;

  const rfEl = document.getElementById('sideRed');
  rfEl.innerHTML = red
    ? '<span style="color:var(--red);font-weight:700">⚠️ ' + [...state.redFlags].join('、') + '</span>'
    : '<span style="color:var(--muted)">未發現</span>';

  document.getElementById('gradeWrap').innerHTML = `
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <div><span class="score-big">${total}</span><small style="color:var(--muted);font-size:14px"> / 80 項異常</small></div>
      <div class="grade ${grade.cls}" style="font-size:15px;padding:8px 20px">${grade.label}</div>
    </div>
    <p style="margin-top:10px;font-size:13px;color:var(--text2)">
      ${red?'<b style="color:var(--red)">已發現紅色警號 — 暫停產品建議，先轉介醫生／營養師。</b>':'按六步閉環 SOP：異常編碼 → 分級 → 聚類 → 產品門檻 → 建議卡 → 復評。'}
    </p>`;

  matchProducts();
  renderProducts();

  const rev = new Date(); rev.setDate(rev.getDate()+14);
  document.getElementById('sideReview').textContent = rev.toISOString().slice(0,10) + '（2週後）';
}

/* ============================================================
   產品匹配
   ============================================================ */
function getCheckedCodes(){
  const codes = new Set();
  ASSESS.forEach(a=>{ if(state.checked.has(a.id)) codes.add(a.code); });
  return codes;
}

function matchProducts(){
  const codes = getCheckedCodes();
  state.products = PRODUCTS.map(p=>{
    const hits = p.thresholds.filter(t=>codes.has(t));
    return {...p, hits, score: hits.length, recommended: hits.length>0};
  }).sort((a,b)=>b.score-a.score);
  document.getElementById('sideProducts').innerHTML = state.products.filter(p=>p.recommended).length
    ? state.products.filter(p=>p.recommended).slice(0,6).map(p=>`<div style="padding:4px 0;border-bottom:1px solid #F0F5EC">✅ ${p.name} <small style="color:var(--muted)">(${p.hits.join(',')})</small></div>`).join('')
    : '<span style="color:var(--muted)">未有匹配</span>';
}

/* ============================================================
   渲染產品
   ============================================================ */
function renderProducts(){
  const wrap = document.getElementById('productWrap');
  const f = state.filter;
  let list = state.products;
  if(f==='rec') list = list.filter(p=>p.recommended);
  else if(f!=='all') list = list.filter(p=>p.cat===f);

  if(!list.length){ wrap.innerHTML = '<div class="empty">此分類暫無匹配產品</div>'; return; }

  wrap.innerHTML = list.map(p=>`
    <div class="product-card ${p.recommended?'recommended':''}">
      ${p.recommended?'<span class="rec-badge">✅ 推薦</span>':''}
      <h4>${p.name}<span class="cat">${p.catName}</span></h4>
      <div class="row"><span class="k">門檻</span><span class="v">${p.thresholds.join('、')}</span></div>
      ${p.hits.length?`<div class="match">命中：${p.hits.join('、')}</div>`:''}
      <div class="row"><span class="k">劑量</span><span class="v">${p.dosage}</span></div>
      <div class="row"><span class="k">時間</span><span class="v">${p.timing}</span></div>
      <div class="row"><span class="k">禁忌</span><span class="v warn">${p.contra}</span></div>
      <div class="row"><span class="k">轉介</span><span class="v">${p.referral}</span></div>
      <div class="row"><span class="k">復評</span><span class="v">${p.review}</span></div>
      <div class="row"><span class="k">停用</span><span class="v">${p.stop}</span></div>
    </div>`).join('');
}

document.querySelectorAll('.filter-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.filter = b.dataset.f;
    renderProducts();
  });
});

/* ============================================================
   異常聚類
   ============================================================ */
function renderCluster(){
  const total = state.checked.size;
  if(total===0){
    document.getElementById('clusterWrap').innerHTML = '<div class="empty">完成評估後，系統會自動聚類</div>';
    return;
  }
  const layers = {};
  for(let l=1;l<=5;l++){
    layers[l] = ASSESS.filter(a=>a.layer===l && state.checked.has(a.id));
  }
  const sorted = Object.entries(layers).sort((a,b)=>b[1].length-a[1].length);

  let html = '<table class="card-table"><thead><tr><th>層次</th><th>異常數</th><th>異常項目</th><th>處理優先</th></tr></thead><tbody>';
  sorted.forEach(([l,items])=>{
    if(!items.length) return;
    const priority = l==4?'🥇 先處理（腸道吸收）':l==3?'🥈 次處理（發炎）':l==5?'🥉 生活調整':l==2?'能量代謝':'結構功能';
    html += `<tr><td>${LAYERS[l].name}</td><td><b>${items.length}</b></td>
      <td>${items.map(a=>a.name).join('、')}</td><td>${priority}</td></tr>`;
  });
  html += '</tbody></table>';

  html += `<div style="margin-top:14px;padding:12px;background:#F0F5EC;border-radius:10px">
    <strong style="font-size:13px">🎯 主問題建議</strong>
    <p style="font-size:13px;margin-top:6px;color:var(--text2)">
    按 SOP：<b>同層多異常 → 選一個核心產品＋一個輔助；跨層異常 → 先處理第四層腸道吸收、第三層發炎，再處理能量／結構。</b>
    主訴匹配優先：客戶最想解決嘅問題，對應客觀異常優先。</p>
  </div>`;

  document.getElementById('clusterWrap').innerHTML = html;
}

/* ============================================================
   產品建議卡
   ============================================================ */
function generateCard(){
  const total = state.checked.size;
  const red = state.redFlags.size>0;
  const grade = getGrade(total, red);
  const name = document.getElementById('cName').value || '客戶';
  const date = document.getElementById('cDate').value || new Date().toISOString().slice(0,10);
  const chief = document.getElementById('cChief').value || '—';
  const rev = new Date(); rev.setDate(rev.getDate()+14);

  const recs = state.products.filter(p=>p.recommended).slice(0, red?2:5);

  let rows = '';
  if(red){
    rows = `<tr><td colspan="6" style="color:var(--red);font-weight:700;text-align:center">
      🚨 已發現紅色警號：${[...state.redFlags].join('、')} — 暫停產品建議，先轉介醫生／營養師。</td></tr>`;
  } else if(!recs.length){
    rows = `<tr><td colspan="6" style="text-align:center;color:var(--muted)">未有匹配產品（異常 < 8 項，建議基礎營養）</td></tr>`;
  } else {
    recs.forEach(p=>{
      rows += `<tr>
        <td>${p.hits.join(',')}</td>
        <td>${p.name}</td>
        <td>${p.thresholds.join('、')}</td>
        <td>${p.dosage}<br><small>${p.timing}</small></td>
        <td>${p.contra}<br><small style="color:var(--red)">${p.referral}</small></td>
        <td>${p.review}</td>
      </tr>`;
    });
  }

  document.getElementById('cardWrap').innerHTML = `
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
      <div><strong>客戶：</strong>${name}　<strong>日期：</strong>${date}</div>
      <div><strong>主訴：</strong>${chief}　<strong>分級：</strong><span class="grade ${grade.cls}">${grade.label}</span></div>
    </div>
    <p style="font-size:13px;margin-bottom:10px"><strong>總異常：</strong>${total} / 80 項</p>
    <table class="card-table">
      <thead><tr><th>異常編碼</th><th>產品</th><th>門檻對應</th><th>用法</th><th>禁忌／轉介</th><th>復評指標</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="margin-top:12px;padding:12px;background:#FFF9C4;border-radius:10px;font-size:13px">
      <strong>📅 復評日期：</strong>${rev.toISOString().slice(0,10)}（2週後）<br>
      <strong>⚠️ 教練話術：</strong>「你的評估顯示…建議先…2週復評…如持續／加重轉介。」唔用「你係缺鐵／甲減」。
    </div>`;

  showToast('✅ 建議卡已生成');
}

/* ============================================================
   重置
   ============================================================ */
function resetAll(){
  if(!confirm('確定重置所有評估？')) return;
  state.checked.clear(); state.redFlags.clear();
  document.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('abnormal'));
  ['cName','cDate','cAge','cH','cW','cWaist','cHx','rfOther'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('cSex').value='';
  document.getElementById('cChief').value='';
  document.getElementById('cardWrap').innerHTML='<div class="empty">完成評估後，系統會自動生成產品建議卡</div>';
  updateAll();
  showToast('🔄 已重置');
}

/* ============================================================
   Toast
   ============================================================ */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ============================================================
   初始化
   ============================================================ */
renderAssess();
updateAll();

const origUpdate = updateAll;
updateAll = function(){
  origUpdate();
  renderCluster();
};
</script>

</html>
