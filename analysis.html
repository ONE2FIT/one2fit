<script>
    // ============================================
    // ⚠️ 將下面呢行換成你 Apps Script 部署後嘅真實網址
    // ============================================
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbw7qdTbJFVwOllB-z9D0HeHcsEL0_rbveMlnauYgneC7KhgnOWWf7TrUErBdVQB9bb_Bw/exec";

    const BOOKING_URL = "https://myfreetime.io/shop/chillclubonmore?utm_source=ig&utm_medium=social&utm_content=link_in_bio&fbclid=PAcGRvZgJleHRuA2FlbQIxMQBzcnRjBmFwcF9pZA85MzY2MTk3NDMzOTI0NTkAAacDTGRl7I1EFasFcUj9PleQ31bK1L8hm9WrOYHJuZucAxLg0C1-2WBg3-c03A_aem_Sr8INfqSvAmAEasDJqcfHw";

    document.getElementById('submitBtn').addEventListener('click', async function() {
        const btn = this;
        const name = document.getElementById('name').value.trim();
        const age = document.getElementById('age').value.trim();
        const currentPain = document.getElementById('currentPain').value.trim();

        // 基本驗證
        if (!name || !age || !currentPain) {
            alert('請最少填寫姓名、年齡，同埋你目前嘅身體不適。呢啲資料係必要嘅，多謝合作。');
            return;
        }

        // 收集複選框資料（腸胃問題）
        const gutIssues = [];
        document.querySelectorAll('input[name="gutIssue"]:checked').forEach(cb => {
            if (cb.value !== '以上皆無') {
                gutIssues.push(cb.value);
            }
        });

        // 如果勾選咗「以上皆無」而且冇其他選項
        if (gutIssues.length === 0) {
            const noneChecked = document.querySelector('input[name="gutIssue"][value="以上皆無"]:checked');
            if (noneChecked) {
                gutIssues.push('無');
            }
        }

        // 整理發送資料
        const data = {
            name: name,
            age: age,
            height: document.getElementById('height').value.trim(),
            weight: document.getElementById('weight').value.trim(),
            contact: document.getElementById('contact').value.trim(),
            currentPain: currentPain,
            duration: document.getElementById('duration').value,
            injuries: document.getElementById('injuries').value.trim(),
            diagnosis: document.getElementById('diagnosis').value.trim(),
            medication: document.getElementById('medication').value.trim(),
            workType: document.getElementById('workType').value,
            dailySitting: document.getElementById('dailySitting').value.trim(),
            exerciseHabit: document.getElementById('exerciseHabit').value.trim(),
            shoeType: document.getElementById('shoeType').value,
            breathPattern: document.getElementById('breathPattern').value,
            gutIssue: gutIssues.join('、'),
            leakage: document.getElementById('leakage').value,
            startle: document.getElementById('startle').value,
            sleepQuality: document.getElementById('sleepQuality').value,
            morningTension: document.getElementById('morningTension').value,
            personality: document.getElementById('personality').value,
            selfDescription: document.getElementById('selfDescription').value.trim()
        };

        // 顯示載入中狀態
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>提交中…';

        try {
            console.log('發送資料：', data);

            const response = await fetch(GOOGLE_SHEET_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            console.log('伺服器回應：', result);

            if (result.status === 'success') {
                // 成功，顯示預約彈窗
                document.getElementById('successModal').classList.add('active');
            } else {
                console.error('儲存失敗：', result.message);
                // 即使失敗都顯示預約彈窗
                document.getElementById('successModal').classList.add('active');
            }

        } catch (error) {
            console.error('發送失敗：', error);
            // 顯示預約彈窗，唔好令客戶白等
            document.getElementById('successModal').classList.add('active');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '📋 提交問卷，立即預約';
        }
    });

    // 關閉彈窗
    document.getElementById('closeModal').addEventListener('click', function() {
        document.getElementById('successModal').classList.remove('active');
    });

    // 點擊彈窗背景也可關閉
    document.getElementById('successModal').addEventListener('click', function(e) {
        if (e.target === this) {
            this.classList.remove('active');
        }
    });

    // 點擊預約連結後關閉彈窗
    document.getElementById('bookingLink').addEventListener('click', function() {
        setTimeout(function() {
            document.getElementById('successModal').classList.remove('active');
        }, 500);
    });
</script>
