<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60分鐘腳底訓練 - 跟骨內側重建計時器</title>
    <style>
        :root {
            --bg: #080c12;
            --surface: #111820;
            --text: #d8d8d8;
            --accent: #ff6b35;
            --accent2: #4ecdc4;
            --warn: #f7c948;
            --rest: #7c5ce7;
            --card: #161f2c;
            --border: #253040;
            --font: 'Segoe UI', 'Helvetica Neue', 'Noto Sans HK', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 階段標籤 */
        .phase-badge {
            display: inline-block;
            background: var(--accent2);
            color: #000;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 6px 16px;
            border-radius: 20px;
            letter-spacing: 0.06em;
            text-align: center;
            align-self: center;
            transition: all 0.3s ease;
        }
        .phase-badge.rest-phase {
            background: var(--rest);
            color: #fff;
        }

        /* 總進度條 */
        .total-progress-bar {
            height: 5px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .total-progress-fill {
            height: 100%;
            background: var(--accent2);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* 圓形計時器 */
        .timer-ring-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .timer-ring {
            position: relative;
            width: 200px;
            height: 200px;
        }
        .timer-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        .timer-ring .bg-circle {
            fill: none;
            stroke: var(--border);
            stroke-width: 10;
        }
        .timer-ring .progress-circle {
            fill: none;
            stroke: var(--accent);
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.9s linear;
        }
        .progress-circle.rest-mode {
            stroke: var(--rest);
        }
        .progress-circle.warn-mode {
            stroke: var(--warn);
        }
        .timer-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .timer-minutes {
            font-size: 3.6rem;
            font-weight: 800;
            line-height: 1;
            color: #fff;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        }
        .timer-seconds {
            font-size: 1.7rem;
            font-weight: 600;
            color: #aaa;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        }
        .timer-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: #777;
            margin-top: 2px;
        }

        /* 動作卡 */
        .action-card {
            background: var(--card);
            border-radius: 22px;
            padding: 20px 18px;
            border: 1px solid var(--border);
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }
        .action-card.rest-card {
            border-color: var(--rest);
            background: #1a1830;
        }
        .action-card .step-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--accent2);
            margin-bottom: 4px;
            font-weight: 700;
        }
        .action-card .action-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .action-card .action-duration {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 10px;
        }
        .action-card .action-detail {
            font-size: 0.92rem;
            color: #bbb;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.025);
            border-radius: 10px;
            padding: 10px 14px;
            text-align: left;
        }

        /* 步驟指示器 */
        .indicator-row {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s ease;
        }
        .indicator-dot.active {
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            transform: scale(1.5);
        }
        .indicator-dot.done {
            background: var(--accent2);
        }

        /* 按鈕 */
        .control-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 13px 26px;
            border-radius: 36px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: all 0.2s ease;
            font-family: var(--font);
            touch-action: manipulation;
        }
        .btn-start {
            background: var(--accent);
            color: #fff;
        }
        .btn-pause {
            background: var(--warn);
            color: #000;
        }
        .btn-reset {
            background: transparent;
            border: 2px solid var(--border);
            color: #bbb;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn:disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        @media (max-width: 420px) {
            .timer-ring {
                width: 160px;
                height: 160px;
            }
            .timer-minutes {
                font-size: 2.8rem;
            }
            .timer-seconds {
                font-size: 1.3rem;
            }
            .action-card .action-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 階段標籤 -->
        <div class="phase-badge" id="phaseBadge">準備開始</div>

        <!-- 總進度條 -->
        <div class="total-progress-bar">
            <div class="total-progress-fill" id="totalProgressFill" style="width: 0%;"></div>
        </div>

        <!-- 圓形計時器 -->
        <div class="timer-ring-container">
            <div class="timer-ring">
                <svg viewBox="0 0 200 200">
                    <circle class="bg-circle" cx="100" cy="100" r="90"/>
                    <circle class="progress-circle" id="progressCircle" cx="100" cy="100" r="90"
                    stroke-dasharray="565.49" stroke-dashoffset="0"/>
                </svg>
                <div class="timer-center">
                    <div class="timer-minutes" id="timerMinutes">60</div>
                    <div class="timer-seconds" id="timerSeconds">00</div>
                    <div class="timer-label" id="timerLabel">分鐘</div>
                </div>
            </div>
        </div>

        <!-- 動作顯示卡 -->
        <div class="action-card" id="actionCard">
            <span class="step-tag" id="stepTag">第 1 / 60 步</span>
            <div class="action-title" id="actionTitle">坐姿跟骨定位</div>
            <div class="action-duration" id="actionDuration">⏱ 1 分鐘</div>
            <div class="action-detail" id="actionDetail">
                坐凳上，赤腳平放。用手將跟骨由外翻向內撥正，叫佢閉眼感受「邊個位掂住地下」。做3次，每次5-8秒。
            </div>
        </div>

        <!-- 步驟指示點 -->
        <div class="indicator-row" id="indicatorRow"></div>

        <!-- 控制按鈕 -->
        <div class="control-row">
            <button class="btn btn-start" id="btnStart" onclick="startTimer()">▶ 開始訓練</button>
            <button class="btn btn-pause" id="btnPause" onclick="pauseTimer()" disabled>⏸ 暫停</button>
            <button class="btn btn-reset" id="btnReset" onclick="resetTimer()">↺ 重設</button>
        </div>
    </div>

    <script>
        // ==================== 訓練步驟定義 ====================
        // 嚴格按照五大階段：本體感受重建 → 靜態加固 → 動中求正 → 擺正加固 → 呼吸重置
        const trainingSteps = [
            // ========== 第一部分：本體感受重建 (0-15分鐘) ==========
            { title: '坐姿跟骨定位 (1)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '坐凳上，赤腳平放。用手將右腳跟骨向內撥正，叫佢閉眼感受5秒：「邊個位掂住地下？」3次搞掂，即刻轉。' },
            { title: '坐姿跟骨定位 (2)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '換左腳，同樣做3次，每次5-8秒。中間完全放鬆，唔好戀戰。' },
            { title: '坐姿跟骨定位 (3)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '再重溫一次右腳+左腳各一次。感覺到腳踭內側掂地就放鬆，唔使死撐。' },
            { title: '坐姿跟骨定位 (4)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '最後一輪坐姿定位。閉眼，腳踭內側掂地，感覺到就話俾我知——好，放鬆。' },
            { title: '過渡：準備企磚', duration: 60, phase: '本體感受重建', rest: false,
                detail: '起身，擺兩塊瑜伽磚平放地面。赤腳，準備企上去。同小朋友講：「而家開始睇動畫片！」' },

            { title: '瑜伽磚內側支撐靜態企立 (1)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '赤腳企上瑜伽磚，雙腳同髖同寬。腳踭內側+大腳趾做支撐，腳掌外側懸空。開電視/平板！' },
            { title: '瑜伽磚內側支撐靜態企立 (2)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '繼續企磚睇動畫片。你企側邊提佢：「內側踩實、外側懸空」。' },
            { title: '瑜伽磚內側支撐靜態企立 (3)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '保持企位，繼續睇片。檢查腳底有冇向外翻，有就撥返正。' },
            { title: '瑜伽磚內側支撐靜態企立 (4)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '繼續睇片企磚。足弓內側微微升起，唔好塌落去。' },
            { title: '瑜伽磚內側支撐靜態企立 (5)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '保持。呢個係課堂第114講嘅數字秘籍——改善跟骨外翻嘅基礎，最安全有效。' },
            { title: '瑜伽磚內側支撐靜態企立 (6)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '繼續睇片。小朋友髖臼未完全閉合，呢個企法唔會負重太多。' },
            { title: '瑜伽磚內側支撐靜態企立 (7)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '保持企位。你每隔1分鐘檢查一次腳底。' },
            { title: '瑜伽磚內側支撐靜態企立 (8)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '繼續睇片企磚。腳底已經開始被動學習內側支撐。' },
            { title: '瑜伽磚內側支撐靜態企立 (9)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '保持。如果佢開始攰，俾佢扶牆，但唔好落磚。' },
            { title: '瑜伽磚內側支撐靜態企立 (10)', duration: 60, phase: '本體感受重建', rest: false,
                detail: '最後一分鐘本體感受重建！準備進入靜態加固階段。' },

            // ========== 第二部分：靜態加固 (15-25分鐘) ==========
            { title: '手持輕重量瑜伽磚企立 (1)', duration: 60, phase: '靜態加固', rest: false,
                detail: '保持企磚，雙手各拎1-2kg水樽。齋企，唔好郁。「腳踭內側踩實，呼吸。重量加咗，腳底更加要鎖實。」' },
            { title: '手持輕重量瑜伽磚企立 (2)', duration: 60, phase: '靜態加固', rest: false,
                detail: '繼續手持重量企磚。如果腳底向外翻或身體搖，減重量或俾佢扶牆。' },
            { title: '手持輕重量瑜伽磚企立 (3)', duration: 60, phase: '靜態加固', rest: false,
                detail: '保持。慢慢加重，但內側支撐唔可以散。' },
            { title: '手持輕重量瑜伽磚企立 (4)', duration: 60, phase: '靜態加固', rest: false,
                detail: '繼續。有阻力之下鎖實內側支撐——呢個係靜態加固嘅核心。' },
            { title: '手持輕重量瑜伽磚企立 (5)', duration: 60, phase: '靜態加固', rest: false,
                detail: '最後一分鐘手持重量企立。準備轉坐姿呼吸。' },

            { title: '坐姿貼背呼吸搵支撐 (1)', duration: 60, phase: '靜態加固', rest: false,
                detail: '坐凳上，背脊完全貼實椅背，雙腳平放。慢呼氣——呼氣時腳踭內側壓地嘅力要加大。「真人之息以踵」' },
            { title: '坐姿貼背呼吸搵支撐 (2)', duration: 60, phase: '靜態加固', rest: false,
                detail: '繼續。「呼氣嘅時候，腳踭踩實地下。吸氣嘅時候，保持住，唔好俾佢散。」' },
            { title: '坐姿貼背呼吸搵支撐 (3)', duration: 60, phase: '靜態加固', rest: false,
                detail: '繼續呼吸搵支撐。將呼吸同腳底支撐連埋一齊。' },
            { title: '坐姿貼背呼吸搵支撐 (4)', duration: 60, phase: '靜態加固', rest: false,
                detail: '繼續。呼吸建立唔到，上面做乜都係白費——呢個係成個訓練嘅關鍵。' },
            { title: '坐姿貼背呼吸搵支撐 (5)', duration: 60, phase: '靜態加固', rest: false,
                detail: '最後一分鐘呼吸搵支撐。準備進入動態訓練。' },

            // ========== 第三部分：動中求正 (25-40分鐘) ==========
            { title: '腳踭內側支撐 + 擺臂 (慢速)', duration: 60, phase: '動中求正', rest: false,
                detail: '企返上瑜伽磚，開始慢速擺臂。支撐項聽腳、擺動項聽手。腳底內側支撐絕對唔可以散！一散就停。' },
            { title: '腳踭內側支撐 + 擺臂 (慢速)', duration: 60, phase: '動中求正', rest: false,
                detail: '繼續慢速擺臂。手臂由上面帶動，支撐由腳話事。千祈唔好先夾膝頭再翻腳！' },
            { title: '腳踭內側支撐 + 擺臂 (加速)', duration: 60, phase: '動中求正', rest: false,
                detail: '加速擺臂！但腳底鎖死唔准郁。一散就停、一散就重頭嚟過。' },
            { title: '腳踭內側支撐 + 擺臂 (加速)', duration: 60, phase: '動中求正', rest: false,
                detail: '繼續加速擺臂。保持腳底內側支撐。' },
            { title: '腳踭內側支撐 + 擺臂 (閉眼)', duration: 60, phase: '動中求正', rest: false,
                detail: '穩咗之後，閉眼做擺臂！訓練大腦同腳底之間嘅連接，等本體感受真正建立。' },
            { title: '腳踭內側支撐 + 擺臂 (閉眼)', duration: 60, phase: '動中求正', rest: false,
                detail: '繼續閉眼擺臂。企唔穩可以扶牆，但腳底唔可以散。' },
            { title: '腳踭內側支撐 + 擺臂 (閉眼)', duration: 60, phase: '動中求正', rest: false,
                detail: '最後一輪閉眼擺臂。呢個係動中求正嘅最高挑戰。' },
            { title: '腳踭內側支撐 + 擺臂 (自由)', duration: 60, phase: '動中求正', rest: false,
                detail: '開眼自由擺臂，快慢交替。保持腳底內側支撐。' },
            { title: '腳踭內側支撐 + 擺臂 (自由)', duration: 60, phase: '動中求正', rest: false,
                detail: '繼續自由擺臂。準備過渡到單腳支撐。' },
            { title: '腳踭內側支撐 + 擺臂 (收尾)', duration: 60, phase: '動中求正', rest: false,
                detail: '最後一分鐘擺臂。準備進入單腳支撐。' },

            { title: '單腳支撐 + 腳踭內側 (右腳)', duration: 60, phase: '動中求正', rest: false,
                detail: '右腳企瑜伽磚，左腳離地。保持腳踭內側踩實。可扶牆，目標15秒。右膝外翻就即刻停、重置。' },
            { title: '單腳支撐 + 腳踭內側 (右腳)', duration: 60, phase: '動中求正', rest: false,
                detail: '繼續右腳單腳企。慢慢減少扶牆力度。' },
            { title: '單腳支撐 + 腳踭內側 (左腳)', duration: 60, phase: '動中求正', rest: false,
                detail: '左腳企瑜伽磚，右腳離地。保持腳踭內側踩實。目標15-20秒。' },
            { title: '單腳支撐 + 腳踭內側 (左腳)', duration: 60, phase: '動中求正', rest: false,
                detail: '繼續左腳單腳企。腳底唔走樣先係重點。' },
            { title: '單腳支撐交替', duration: 60, phase: '動中求正', rest: false,
                detail: '左右腳交替單腳企。右腳內側支撐喺單腳之下仲未夠穩？即刻停、重置、再嚟。' },

            // ========== 第四部分：擺正加固 (40-55分鐘) ==========
            { title: '窄距站立 + 腳踭外擠 (1)', duration: 60, phase: '擺正加固', rest: false,
                detail: '兩塊瑜伽磚拍埋，窄距企上去。腳踭向外擠、向地面壓，好似想將磚向外推開。同時大腳趾壓實磚面。' },
            { title: '窄距站立 + 腳踭外擠 (2)', duration: 60, phase: '擺正加固', rest: false,
                detail: '繼續腳踭外擠。呢個係課堂第93講：腳外旋壓內側、內旋壓外側。' },
            { title: '窄距站立 + 腳踭外擠 (3)', duration: 60, phase: '擺正加固', rest: false,
                detail: '繼續。做3下、抖10秒，重複。目標慢慢由3下加到7下。' },
            { title: '窄距站立 + 腳踭外擠 (4)', duration: 60, phase: '擺正加固', rest: false,
                detail: '繼續腳踭外擠。最少要做7下，大腦先會有最基本嘅記憶。' },
            { title: '窄距站立 + 腳踭外擠 (5)', duration: 60, phase: '擺正加固', rest: false,
                detail: '繼續。保持大腳趾壓實，腳踭向外擠。' },
            { title: '窄距站立 + 腳踭外擠 (6)', duration: 60, phase: '擺正加固', rest: false,
                detail: '繼續。如果做到7下以上，可以挑戰10下。' },
            { title: '窄距站立 + 腳踭外擠 (7)', duration: 60, phase: '擺正加固', rest: false,
                detail: '繼續。每個擠壓都要有控制，唔係求其做。' },
            { title: '窄距站立 + 腳踭外擠 (8)', duration: 60, phase: '擺正加固', rest: false,
                detail: '繼續腳踭外擠。鎖死之後先郁——呢個係擺正加固嘅核心。' },
            { title: '窄距站立 + 腳踭外擠 (9)', duration: 60, phase: '擺正加固', rest: false,
                detail: '繼續。保持呼吸，唔好閉氣。' },
            { title: '窄距站立 + 腳踭外擠 (10)', duration: 60, phase: '擺正加固', rest: false,
                detail: '最後一分鐘腳踭外擠。準備進入呼吸重置。' },

            // ========== 第五部分：呼吸重置 (55-60分鐘) ==========
            { title: '仰臥呼吸重置 (1)', duration: 60, phase: '呼吸重置', rest: false,
                detail: '仰臥，雙腳平放、膝頭彎曲，腳底踩實地面。慢而深嘅呼氣。「呼氣時腳踭內側壓實地下，呼到盡，停一秒。」' },
            { title: '仰臥呼吸重置 (2)', duration: 60, phase: '呼吸重置', rest: false,
                detail: '繼續仰臥呼吸。將成堂訓練嘅效果整合。' },
            { title: '仰臥呼吸重置 (3)', duration: 60, phase: '呼吸重置', rest: false,
                detail: '繼續。幫系統由交感神經（興奮狀態）切換返去副交感神經。' },
            { title: '仰臥呼吸重置 (4)', duration: 60, phase: '呼吸重置', rest: false,
                detail: '繼續慢呼氣、腳踭壓地。放鬆吸氣，保持支撐。' },
            { title: '訓練完成！', duration: 60, phase: '完成', rest: true,
                detail: '🎉 60分鐘訓練全部完成！「今日做得好好！」俾小朋友自由活動。記住：腳底唔散先好加難度，散咗就退返上一步。每星期2-3次，三個月見改善。' },
        ];

        // ==================== 狀態管理 ====================
        const TOTAL_STEPS = trainingSteps.length;
        const TOTAL_DURATION = TOTAL_STEPS * 60;
        const CIRCUMFERENCE = 2 * Math.PI * 90;

        let currentStepIndex = 0;
        let timeLeftInStep = 60;
        let totalElapsedSeconds = 0;
        let timerInterval = null;
        let isRunning = false;
        let isPaused = false;

        // ==================== DOM ====================
        const phaseBadgeEl = document.getElementById('phaseBadge');
        const totalProgressFillEl = document.getElementById('totalProgressFill');
        const progressCircleEl = document.getElementById('progressCircle');
        const timerMinutesEl = document.getElementById('timerMinutes');
        const timerSecondsEl = document.getElementById('timerSeconds');
        const timerLabelEl = document.getElementById('timerLabel');
        const stepTagEl = document.getElementById('stepTag');
        const actionTitleEl = document.getElementById('actionTitle');
        const actionDurationEl = document.getElementById('actionDuration');
        const actionDetailEl = document.getElementById('actionDetail');
        const actionCardEl = document.getElementById('actionCard');
        const indicatorRowEl = document.getElementById('indicatorRow');
        const btnStartEl = document.getElementById('btnStart');
        const btnPauseEl = document.getElementById('btnPause');
        const btnResetEl = document.getElementById('btnReset');

        // ==================== 指示器 ====================
        function buildIndicators() {
            indicatorRowEl.innerHTML = '';
            for (let i = 0; i < TOTAL_STEPS; i++) {
                const dot = document.createElement('span');
                dot.className = 'indicator-dot';
                dot.title = `${i + 1}: ${trainingSteps[i].title}`;
                dot.dataset.index = i;
                indicatorRowEl.appendChild(dot);
            }
        }

        function updateIndicators() {
            const dots = indicatorRowEl.querySelectorAll('.indicator-dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'done');
                if (i < currentStepIndex) dot.classList.add('done');
                if (i === currentStepIndex) dot.classList.add('active');
            });
        }

        // ==================== 更新顯示 ====================
        function updateDisplay() {
            const step = trainingSteps[currentStepIndex];

            // 階段標籤
            phaseBadgeEl.textContent = step.phase;
            phaseBadgeEl.classList.toggle('rest-phase', step.rest);

            // 總進度條
            const progressPercent = (totalElapsedSeconds / TOTAL_DURATION) * 100;
            totalProgressFillEl.style.width = `${progressPercent}%`;

            // 圓形進度環
            const stepProgress = timeLeftInStep / 60;
            const offset = CIRCUMFERENCE * (1 - stepProgress);
            progressCircleEl.style.strokeDashoffset = offset;
            progressCircleEl.classList.remove('rest-mode', 'warn-mode');
            if (step.rest) progressCircleEl.classList.add('rest-mode');
            if (timeLeftInStep <= 10 && !step.rest) progressCircleEl.classList.add('warn-mode');

            // 計時器數字
            const min = Math.floor(timeLeftInStep / 60);
            const sec = timeLeftInStep % 60;
            timerMinutesEl.textContent = min;
            timerSecondsEl.textContent = sec.toString().padStart(2, '0');
            timerLabelEl.textContent = step.rest ? '休息' : '分鐘';

            // 動作卡
            stepTagEl.textContent = `第 ${currentStepIndex + 1} / ${TOTAL_STEPS} 步`;
            actionTitleEl.textContent = step.title;
            actionDurationEl.textContent = `⏱ ${step.duration} 秒`;
            actionDetailEl.textContent = step.detail;
            actionCardEl.classList.toggle('rest-card', step.rest);

            updateIndicators();
        }

        // ==================== 步驟切換 ====================
        function advanceStep() {
            if (currentStepIndex < TOTAL_STEPS - 1) {
                currentStepIndex++;
                timeLeftInStep = 60;
                updateDisplay();
            } else {
                completeTraining();
            }
        }

        function completeTraining() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            isPaused = false;
            btnStartEl.disabled = false;
            btnPauseEl.disabled = true;
            btnStartEl.textContent = '▶ 開始訓練';
            phaseBadgeEl.textContent = '完成';
            phaseBadgeEl.classList.add('rest-phase');
            actionTitleEl.textContent = '🎉 訓練完成！';
            actionDetailEl.textContent = '60分鐘全部完成！每星期2-3次，三個月見改善。俾小朋友自由活動，唔好加操。';
            timerMinutesEl.textContent = '0';
            timerSecondsEl.textContent = '00';
            progressCircleEl.style.strokeDashoffset = CIRCUMFERENCE;
            totalProgressFillEl.style.width = '100%';
            actionCardEl.classList.add('rest-card');
            const dots = indicatorRowEl.querySelectorAll('.indicator-dot');
            dots.forEach(d => { d.classList.add('done');
                d.classList.remove('active'); });
        }

        // ==================== 計時器 ====================
        function tick() {
            if (!isRunning) return;
            timeLeftInStep--;
            totalElapsedSeconds++;
            if (timeLeftInStep <= 0) advanceStep();
            updateDisplay();
            if (currentStepIndex >= TOTAL_STEPS - 1 && timeLeftInStep <= 0) completeTraining();
        }

        function startTimer() {
            if (isRunning && !isPaused) return;
            if (isPaused) {
                isPaused = false;
                isRunning = true;
                btnPauseEl.disabled = false;
                btnStartEl.textContent = '▶ 進行中';
                btnStartEl.disabled = true;
                timerInterval = setInterval(tick, 1000);
                return;
            }
            isRunning = true;
            isPaused = false;
            btnStartEl.disabled = true;
            btnStartEl.textContent = '▶ 進行中';
            btnPauseEl.disabled = false;
            timerInterval = setInterval(tick, 1000);
            updateDisplay();
        }

        function pauseTimer() {
            if (!isRunning) return;
            isRunning = false;
            isPaused = true;
            clearInterval(timerInterval);
            timerInterval = null;
            btnStartEl.disabled = false;
            btnStartEl.textContent = '▶ 繼續';
            btnPauseEl.disabled = true;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            isPaused = false;
            currentStepIndex = 0;
            timeLeftInStep = 60;
            totalElapsedSeconds = 0;
            btnStartEl.disabled = false;
            btnStartEl.textContent = '▶ 開始訓練';
            btnPauseEl.disabled = true;
            progressCircleEl.style.strokeDashoffset = '0';
            progressCircleEl.classList.remove('rest-mode', 'warn-mode');
            totalProgressFillEl.style.width = '0%';
            actionCardEl.classList.remove('rest-card');
            phaseBadgeEl.classList.remove('rest-phase');
            updateDisplay();
        }

        // ==================== 鍵盤快捷鍵 ====================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning && !isPaused) pauseTimer();
                else startTimer();
            }
            if (e.code === 'KeyR' && e.ctrlKey) {
                e.preventDefault();
                resetTimer();
            }
        });

        // ==================== 初始化 ====================
        function init() {
            buildIndicators();
            progressCircleEl.style.strokeDasharray = CIRCUMFERENCE;
            progressCircleEl.style.strokeDashoffset = '0';
            updateDisplay();
        }
        init();
    </script>
</body>
</html>
