<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE2FIT 身體評估問卷</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang HK", sans-serif;
            background: #0f172a; color: #e2e8f0; line-height: 1.7; padding: 20px;
        }
        .container {
            max-width: 700px; margin: 0 auto; background: #1e293b;
            border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .header {
            background: linear-gradient(135deg, #1a2a3a 0%, #0f172a 100%);
            padding: 40px 30px 30px; text-align: center; border-bottom: 2px solid #334155;
        }
        .header h1 { font-size: 28px; font-weight: 800; color: #f8fafc; margin-bottom: 8px; letter-spacing: 1px; }
        .header p { font-size: 15px; color: #94a3b8; }
        .body-content { padding: 30px; }
        .section { background: #0f172a; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .section h2 { font-size: 18px; font-weight: 700; color: #f8fafc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section h2 span { background: #3b82f6; color: #fff; font-size: 14px; padding: 2px 10px; border-radius: 12px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; color: #f1f5f9; margin-bottom: 6px; }
        .form-group .hint { font-size: 12px; color: #64748b; font-weight: 400; font-style: italic; margin-bottom: 4px; display: block; }
        input[type="text"], input[type="number"], input[type="tel"], input[type="email"], select, textarea {
            width: 100%; padding: 12px 14px; background: #1e293b; border: 1px solid #334155;
            border-radius: 8px; color: #f8fafc; font-size: 15px; transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6; }
        textarea { resize: vertical; min-height: 80px; font-family: inherit; }
        .checkbox-group, .radio-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        .checkbox-group label, .radio-group label {
            display: flex; align-items: center; background: #1e293b; padding: 8px 14px;
            border-radius: 8px; font-weight: 400; font-size: 14px; cursor: pointer; border: 1px solid #334155;
        }
        .checkbox-group label:hover, .radio-group label:hover { background: #334155; }
        .checkbox-group input[type="checkbox"], .radio-group input[type="radio"] {
            margin-right: 8px; accent-color: #3b82f6; width: 16px; height: 16px;
        }
        .submit-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #fff; border: none; border-radius: 12px; font-size: 18px; font-weight: 800;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; letter-spacing: 1px;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.4); }
        .submit-btn:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; }
        .success-message { display: none; text-align: center; padding: 40px 30px; }
        .success-message h2 { font-size: 24px; color: #f8fafc; margin-bottom: 12px; }
        .success-message p { color: #94a3b8; font-size: 15px; }
        .error-message { background: #7f1d1d; color: #fca5a5; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 14px; }
        @media (max-width: 480px) { .checkbox-group, .radio-group { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container" id="mainContent">
        <div class="header">
            <h1>ONE2FIT 身體評估</h1>
            <p>填妥以下問卷，讓我哋了解你嘅身體狀況，然後制定專屬訓練方案</p>
        </div>

        <div class="body-content" id="formContent">
            <div class="error-message" id="errorMessage"></div>

            <form id="assessmentForm">
                <!-- 基本資料 -->
                <div class="section">
                    <h2><span>1</span> 基本資料</h2>
                    <div class="form-group">
                        <label for="name">姓名 / 稱呼 *</label>
                        <input type="text" id="name" name="name" placeholder="例如：陳大文" required>
                    </div>
                    <div class="form-group">
                        <label for="age">年齡 *</label>
                        <input type="number" id="age" name="age" placeholder="例如：35" min="1" max="120" required>
                    </div>
                    <div class="form-group">
                        <label for="height">身高（cm）*</label>
                        <input type="number" id="height" name="height" placeholder="例如：170" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="weight">體重（kg）*</label>
                        <input type="number" id="weight" name="weight" placeholder="例如：65" step="0.1" required>
                    </div>
                </div>

                <!-- 身體狀況 -->
                <div class="section">
                    <h2><span>2</span> 身體狀況</h2>
                    <div class="form-group">
                        <label>邊度唔舒服？（可選多項）*</label>
                        <span class="hint">揀選所有有疼痛、酸脹、卡住、扯住嘅部位</span>
                        <div class="checkbox-group" id="painAreaGroup">
                            <label><input type="checkbox" name="painArea" value="頸"> 頸</label>
                            <label><input type="checkbox" name="painArea" value="肩"> 肩</label>
                            <label><input type="checkbox" name="painArea" value="上背"> 上背</label>
                            <label><input type="checkbox" name="painArea" value="下背/腰"> 下背/腰</label>
                            <label><input type="checkbox" name="painArea" value="髖"> 髖</label>
                            <label><input type="checkbox" name="painArea" value="膝"> 膝</label>
                            <label><input type="checkbox" name="painArea" value="腳踝/腳"> 腳踝/腳</label>
                            <label><input type="checkbox" name="painArea" value="頭"> 頭</label>
                            <label><input type="checkbox" name="painArea" value="其他"> 其他</label>
                        </div>
                        <input type="text" id="painOther" name="painOther" placeholder="如有其他，請註明" style="margin-top:8px;">
                    </div>
                    <div class="form-group">
                        <label for="duration">呢啲問題持續咗幾耐？*</label>
                        <select id="duration" name="duration" required>
                            <option value="">請選擇</option>
                            <option value="少於1週">少於1週</option>
                            <option value="1-4週">1-4週</option>
                            <option value="1-3個月">1-3個月</option>
                            <option value="3-6個月">3-6個月</option>
                            <option value="6個月以上">6個月以上</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="surgery">有冇開過刀、受過傷？（骨折、扭傷、車禍等）</label>
                        <textarea id="surgery" name="surgery" placeholder="請簡單描述，例如：2019年右腳踝扭傷、2022年盲腸切除..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="disease">有冇被診斷過嘅疾病？有冇在食藥？</label>
                        <textarea id="disease" name="disease" placeholder="例如：高血壓（食緊降壓藥）、糖尿病、椎間盤突出..."></textarea>
                    </div>
                </div>

                <!-- 生活與運動 -->
                <div class="section">
                    <h2><span>3</span> 生活與運動</h2>
                    <div class="form-group">
                        <label>工作型態 *</label>
                        <div class="radio-group">
                            <label><input type="radio" name="workType" value="久坐" required> 久坐</label>
                            <label><input type="radio" name="workType" value="久站"> 久站</label>
                            <label><input type="radio" name="workType" value="混合"> 混合</label>
                            <label><input type="radio" name="workType" value="其他"> 其他</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>運動習慣 *</label>
                        <div class="radio-group">
                            <label><input type="radio" name="exerciseHabit" value="無" required> 無</label>
                            <label><input type="radio" name="exerciseHabit" value="偶爾（每週少於2次）"> 偶爾（每週少於2次）</label>
                            <label><input type="radio" name="exerciseHabit" value="規律（每週2次以上）"> 規律（每週2次以上）</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>平時做開咩運動？（可選多項）</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="exerciseType" value="重訓/擼鐵"> 重訓/擼鐵</label>
                            <label><input type="checkbox" name="exerciseType" value="跑步"> 跑步</label>
                            <label><input type="checkbox" name="exerciseType" value="瑜伽"> 瑜伽</label>
                            <label><input type="checkbox" name="exerciseType" value="普拉提"> 普拉提</label>
                            <label><input type="checkbox" name="exerciseType" value="游水"> 游水</label>
                            <label><input type="checkbox" name="exerciseType" value="球類"> 球類</label>
                            <label><input type="checkbox" name="exerciseType" value="其他"> 其他</label>
                        </div>
                        <input type="text" id="exerciseOther" name="exerciseOther" placeholder="如有其他，請註明" style="margin-top:8px;">
                    </div>
                </div>

                <!-- 呼吸與內臟 -->
                <div class="section">
                    <h2><span>4</span> 呼吸與內臟</h2>
                    <div class="form-group">
                        <label>有冇胃部不適？（可選多項）</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="stomachIssue" value="胃脹"> 胃脹</label>
                            <label><input type="checkbox" name="stomachIssue" value="胃酸"> 胃酸</label>
                            <label><input type="checkbox" name="stomachIssue" value="胃痛"> 胃痛</label>
                            <label><input type="checkbox" name="stomachIssue" value="無"> 無</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>有冇以下情況？（可選多項）</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="pelvicIssue" value="咳嗽打噴嚏漏尿"> 咳嗽/打噴嚏漏尿</label>
                            <label><input type="checkbox" name="pelvicIssue" value="便秘"> 便秘</label>
                            <label><input type="checkbox" name="pelvicIssue" value="痔瘡"> 痔瘡</label>
                            <label><input type="checkbox" name="pelvicIssue" value="無"> 無</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>睡眠品質 *</label>
                        <div class="radio-group">
                            <label><input type="radio" name="sleepQuality" value="很好" required> 很好</label>
                            <label><input type="radio" name="sleepQuality" value="普通"> 普通</label>
                            <label><input type="radio" name="sleepQuality" value="差"> 差</label>
                            <label><input type="radio" name="sleepQuality" value="很差"> 很差</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    📋 提交評估資料
                </button>
            </form>
        </div>

        <div class="success-message" id="successMessage">
            <h2>🎉 提交成功！</h2>
            <p>多謝你嘅資料。<br>我哋會喺 24 小時內透過 WhatsApp 聯絡你，<br>安排下一步嘅線上評估。</p>
            <p style="margin-top:16px; font-size:14px; color:#94a3b8;">如有任何相片/影片想補充，請 WhatsApp 我哋</p>
        </div>
    </div>

    <script>
        // === 換成你嘅真實部署網址 ===
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxIhS2pHroISKiDT8Ty7ijQFt1qPGZPrRLGImfICqaAWUbx7AoiKMuMGPO4TMwztD4Q/exec";

        const form = document.getElementById('assessmentForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const formContent = document.getElementById('formContent');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            console.log('表單提交觸發'); // 除錯用

            // 收集數據
            const name = document.getElementById('name').value.trim();
            const age = document.getElementById('age').value.trim();
            const height = document.getElementById('height').value.trim();
            const weight = document.getElementById('weight').value.trim();
            const duration = document.getElementById('duration').value;
            const workTypeRadio = document.querySelector('input[name="workType"]:checked');
            const exerciseHabitRadio = document.querySelector('input[name="exerciseHabit"]:checked');
            const sleepQualityRadio = document.querySelector('input[name="sleepQuality"]:checked');

            // 驗證必填欄位
            if (!name || !age || !height || !weight || !duration || !workTypeRadio || !exerciseHabitRadio || !sleepQualityRadio) {
                errorMessage.textContent = '請填寫所有必填欄位（標有 * 號）';
                errorMessage.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                console.log('驗證失敗：有必填欄位未填');
                return;
            }

            // 收集痛點
            const painCheckboxes = document.querySelectorAll('input[name="painArea"]:checked');
            const painAreas = Array.from(painCheckboxes).map(cb => cb.value);
            const painOther = document.getElementById('painOther').value.trim();
            if (painOther) painAreas.push('其他：' + painOther);
            const painAreasStr = painAreas.join(', ');

            // 收集運動類型
            const exerciseCheckboxes = document.querySelectorAll('input[name="exerciseType"]:checked');
            const exerciseTypes = Array.from(exerciseCheckboxes).map(cb => cb.value);
            const exerciseOther = document.getElementById('exerciseOther').value.trim();
            if (exerciseOther) exerciseTypes.push('其他：' + exerciseOther);
            const exerciseTypesStr = exerciseTypes.join(', ');

            // 收集胃部問題
            const stomachCheckboxes = document.querySelectorAll('input[name="stomachIssue"]:checked');
            const stomachIssues = Array.from(stomachCheckboxes).map(cb => cb.value);
            const stomachIssuesStr = stomachIssues.join(', ');

            // 收集盆底問題
            const pelvicCheckboxes = document.querySelectorAll('input[name="pelvicIssue"]:checked');
            const pelvicIssues = Array.from(pelvicCheckboxes).map(cb => cb.value);
            const pelvicIssuesStr = pelvicIssues.join(', ');

            // 其他資料
            const surgery = document.getElementById('surgery').value.trim();
            const disease = document.getElementById('disease').value.trim();
            const timestamp = new Date().toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' });

            // 禁用按鈕
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ 提交中...';
            errorMessage.style.display = 'none';

            // 手動構建 URL
            let requestURL = SCRIPT_URL + '?';
            requestURL += 'name=' + encodeURIComponent(name);
            requestURL += '&age=' + encodeURIComponent(age);
            requestURL += '&height=' + encodeURIComponent(height);
            requestURL += '&weight=' + encodeURIComponent(weight);
            requestURL += '&painAreas=' + encodeURIComponent(painAreasStr);
            requestURL += '&duration=' + encodeURIComponent(duration);
            requestURL += '&surgery=' + encodeURIComponent(surgery);
            requestURL += '&disease=' + encodeURIComponent(disease);
            requestURL += '&workType=' + encodeURIComponent(workTypeRadio.value);
            requestURL += '&exerciseHabit=' + encodeURIComponent(exerciseHabitRadio.value);
            requestURL += '&exerciseTypes=' + encodeURIComponent(exerciseTypesStr);
            requestURL += '&stomachIssues=' + encodeURIComponent(stomachIssuesStr);
            requestURL += '&pelvicIssues=' + encodeURIComponent(pelvicIssuesStr);
            requestURL += '&sleepQuality=' + encodeURIComponent(sleepQualityRadio.value);
            requestURL += '&timestamp=' + encodeURIComponent(timestamp);
            requestURL += '&r=' + Math.random();

            console.log('發送請求 URL:', requestURL); // 除錯用

            // 使用 Image Beacon
            const img = new Image();
            img.onload = function() {
                console.log('Image loaded - 成功');
                showSuccess();
            };
            img.onerror = function() {
                console.log('Image error - 但資料通常已發送');
                showSuccess();
            };
            img.src = requestURL;

            // 後備：3秒後強制顯示成功
            setTimeout(function() {
                if (successMessage.style.display === 'none' || !successMessage.style.display) {
                    console.log('後備機制觸發');
                    showSuccess();
                }
            }, 3000);
        });

        function showSuccess() {
            formContent.style.display = 'none';
            successMessage.style.display = 'block';
        }
    </script>
</body>
</html>
